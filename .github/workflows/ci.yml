name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm ci
        working-directory: api

      - name: Lint
        run: npm run lint

      - name: Type-check + build frontend
        run: npm run build

      - name: Type-check + build API
        run: npm run build
        working-directory: api

      - name: Run tests
        run: npm test
