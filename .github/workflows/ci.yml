name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Lint
        run: npm run lint

      - name: Type-check + build frontend
        run: npm run build

      - name: Type-check + build server
        run: npm run build
        working-directory: server

      - name: Run tests
        run: npm test

      - name: Docker build (no push)
        run: docker build -t campingvogn-vaegt-pwa:ci .
